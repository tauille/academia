<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="itrainer - App de treinos: planilhas, acompanhamento e progresso.">
  <meta name="theme-color" content="#121214">
  <title>itrainer - Seus treinos</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="app-header">
    <div class="header-inner">
      <button class="logo" data-view="inicio">i<span>trainer</span></button>
      <span class="header-day" id="headerDay"></span>
    </div>
  </header>

  <main class="app-main">

    <!-- ===== TELA INÍCIO ===== -->
    <section class="view active" id="view-inicio">
      <div class="container">
        <div class="welcome">
          <h1>Bora treinar, <span id="saudacao"></span> 💪</h1>
          <p id="fraseDia"></p>
        </div>
        <div id="cardHoje"></div>
        <div class="stats-grid">
          <div class="stat-card">
            <span class="stat-valor" id="statSemana">0</span>
            <span class="stat-rotulo">Treinos na semana</span>
          </div>
          <div class="stat-card">
            <span class="stat-valor" id="statSequencia">0</span>
            <span class="stat-rotulo">Dias seguidos</span>
          </div>
          <div class="stat-card">
            <span class="stat-valor" id="statExercicios">0</span>
            <span class="stat-rotulo">Exercícios feitos</span>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== TELA TREINOS ===== -->
    <section class="view" id="view-treinos">
      <div class="container">
        <div class="dias-tabs" id="diasTabs"></div>
        <div id="listaExercicios"></div>
      </div>
    </section>

    <!-- ===== TELA PROGRESSO ===== -->
    <section class="view" id="view-progresso">
      <div class="container">
        <div class="section-titulo">
          <h2>Seu progresso</h2>
          <p>Histórico dos últimos 7 dias</p>
        </div>
        <div class="barra-semana" id="barraSemana"></div>
        <div class="resumo-progresso" id="resumoProgresso"></div>
      </div>
    </section>

  </main>

  <!-- NAVEGAÇÃO INFERIOR -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-view="inicio">
      <span class="nav-icone">🏠</span><span>Início</span>
    </button>
    <button class="nav-item" data-view="treinos">
      <span class="nav-icone">🏋️</span><span>Treinos</span>
    </button>
    <button class="nav-item" data-view="progresso">
      <span class="nav-icone">📈</span><span>Progresso</span>
    </button>
  </nav>

  <!-- MODAL TIMER -->
  <div class="modal" id="modalTimer">
    <div class="modal-conteudo">
      <h3>Descanso</h3>
      <div class="timer-numero" id="timerNumero">90</div>
      <div class="timer-botoes">
        <button class="btn btn-outline" id="timerPausar">Pausar</button>
        <button class="btn btn-primary" id="timerFechar">Pular</button>
      </div>
    </div>
  </div>

  <script src="js/config.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
