<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>iTrainer</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css?v=5">
</head>
<body>

  <header class="app-header">
    <div class="header-inner">
      <div class="logo">i<span>Trainer</span></div>
    </div>
  </header>

  <main class="app-main" id="appMain">
    <div class="container">
      <section id="view-treinos" class="view">
        <div id="listaTreinos"></div>
      </section>

      <section id="view-historico" class="view">
        <div id="listaHistorico"></div>
      </section>

      <section id="view-gerenciar" class="view">
        <div class="section-titulo">
          <h2>Gerenciar</h2>
          <p>Seus treinos</p>
        </div>
        <button class="btn btn-primary btn-bloco" id="btnNovoTreino">+ Novo treino</button>
        <div id="listaGerenciar"></div>
      </section>

      <section id="view-nutricao" class="view"></section>
    </div>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item" data-view="treinos" type="button">
      <span class="nav-icone">🏋️</span>Treinos
    </button>
    <button class="nav-item" data-view="nutricao" type="button">
      <span class="nav-icone">🥗</span>Nutrição
    </button>
    <button class="nav-item" data-view="historico" type="button">
      <span class="nav-icone">📊</span>Histórico
    </button>
    <button class="nav-item" data-view="gerenciar" type="button">
      <span class="nav-icone">⚙️</span>Gerenciar
    </button>
  </nav>

  <!-- Modal: editor de treino -->
  <div class="modal" id="modalEditor">
    <div class="modal-sheet modal-editor">
      <div id="editorCorpo"></div>
    </div>
  </div>

  <!-- Modal: timer -->
  <div class="modal" id="modalTimer">
    <div class="modal-sheet">
      <span class="timer-titulo" id="timerTitulo">Descanso</span>
      <span class="timer-exercicio" id="timerExercicio"></span>
      <div class="timer-ring-wrap">
        <svg class="ring" viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
          <circle class="ring-fill" id="timerRing" cx="60" cy="60" r="52"></circle>
        </svg>
        <div class="timer-numero" id="timerNumero">0</div>
      </div>
      <div class="timer-botoes">
        <button class="btn btn-outline" id="timerPausar">Pausar</button>
        <button class="btn btn-primary" id="timerFechar">Fechar</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="js/config.js?v=4"></script>
  <script src="js/nutricao-alimentos.js?v=2"></script>
  <script src="js/nutricao-dados.js?v=2"></script>
  <script src="js/nutricao-ui.js?v=2"></script>
  <script src="js/nutricao-views.js?v=2"></script>
  <script src="js/nutricao-modais.js?v=2"></script>
  <script src="js/nutricao-app.js?v=2"></script>
  <script src="equipamentos.js"></script>
  <script src="autocomplete-equipamento.js"></script>
  <script src="js/main.js?v=7"></script>
  
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>

</body>
</html>
