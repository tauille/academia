<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0b0e">
  <title>itrainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="app-header">
    <div class="header-inner">
      <button class="logo" data-view="treinos">i<span>trainer</span></button>
    </div>
  </header>

  <main class="app-main" id="appMain">

    <!-- TELA TREINOS (listar + executar) -->
    <section class="view active" id="view-treinos">
      <div class="container">
        <div id="listaTreinos"></div>
      </div>
    </section>

    <!-- TELA GERENCIAR (CRUD) -->
    <section class="view" id="view-gerenciar">
      <div class="container">
        <div class="section-titulo">
          <h2>Gerenciar</h2>
          <p>Crie, edite ou exclua treinos e exercícios.</p>
        </div>
        <div id="listaGerenciar"></div>
        <button class="btn btn-primary btn-bloco" id="btnNovoTreino">+ Novo treino</button>
      </div>
    </section>

  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" data-view="treinos">
      <span class="nav-icone">🏋️</span><span>Treinos</span>
    </button>
    <button class="nav-item" data-view="gerenciar">
      <span class="nav-icone">⚙️</span><span>Gerenciar</span>
    </button>
  </nav>

  <!-- TIMER -->
  <div class="modal" id="modalTimer">
    <div class="modal-sheet">
      <span class="timer-titulo" id="timerTitulo">Descanso</span>
      <span class="timer-exercicio" id="timerExercicio"></span>
      <div class="timer-ring-wrap">
        <svg class="ring timer-ring" viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="52"/>
          <circle class="ring-fill timer-ring-fill" id="timerRing" cx="60" cy="60" r="52"/>
        </svg>
        <div class="timer-numero" id="timerNumero">0</div>
      </div>
      <div class="timer-botoes">
        <button class="btn btn-outline" id="timerPausar">Pausar</button>
        <button class="btn btn-primary" id="timerFechar">Pular</button>
      </div>
    </div>
  </div>

  <!-- EDITOR DE TREINO -->
  <div class="modal" id="modalEditor">
    <div class="modal-sheet modal-editor">
      <div id="editorCorpo"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script src="js/config.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
