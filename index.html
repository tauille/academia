<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0e120a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>iTrainer</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css?v=4">
</head>
<body>

  <header class="app-header">
    <h1>iTrainer</h1>
  </header>

  <main class="app-main">
    <section id="view-treinos" class="view"></section>
    <section id="view-historico" class="view"></section>
    <section id="view-gerenciar" class="view"></section>
    <section id="view-nutricao" class="view"></section>
  </main>

  <nav id="barra-tab" class="barra-tab">
    <button class="tab" data-view="treinos" type="button">Treinos</button>
    <button class="tab" data-view="historico" type="button">Histórico</button>
    <button class="tab" data-view="gerenciar" type="button">Gerenciar</button>
    <button id="tab-nutricao" class="tab" data-view="nutricao" type="button">Nutrição</button>
  </nav>

  <script src="js/config.js?v=4"></script>
  <script src="js/main.js?v=4"></script>
  <script src="js/nutricao.js?v=4"></script>
  <script>
    // Service worker — cache offline
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    // Integração da 4ª aba (Nutrição)
    // O main.js gerencia Treinos/Histórico/Gerenciar; este bloco apenas
    // garante que a view de nutrição apareça e inicialize ao tocar na aba.
    (function () {
      var botao = document.getElementById('tab-nutricao');
      if (!botao) return;

      botao.addEventListener('click', function () {
        var alvo = document.getElementById('view-nutricao');
        if (alvo) {
          document.querySelectorAll('.view').forEach(function (s) {
            s.classList.remove('ativa');
          });
          alvo.classList.add('ativa');
        }
        if (window.Nutricao) {
          window.Nutricao.init();
        }
      });
    })();
  </script>
</body>
</html>
